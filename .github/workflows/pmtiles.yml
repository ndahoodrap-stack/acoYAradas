name: Generate PMTiles

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/web/public/*.geojson'
      - '.github/workflows/pmtiles.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tippecanoe
        run: sudo apt update && sudo apt install -y tippecanoe
      - name: Generate PMTiles
        run: |
          tippecanoe -o bolivar.pmtiles --drop-densest-as-needed --force \
            --layer=zonas apps/web/public/bolivar.geojson \
            --layer=calles apps/web/public/bolivar-calles-simplified.geojson \
            --layer=direcciones apps/web/public/bolivar-addresses.geojson
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolivar-pmtiles
          path: bolivar.pmtiles
          retention-days: 7