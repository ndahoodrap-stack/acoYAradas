<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <meta
      name="description"
      content="acoYAradas! - Comercios de tu zona, a un click. Comprá online, seguí tu pedido y ganá lugar en tu barrio."
    />
    <link rel="icon" type="image/svg+xml" href="/placeholders/logo-aco.svg" />
    <title>acoYAradas! - Comercios de tu zona</title>
    <!-- maplibre-gl UMD build v4 (con worker inline, CORS OK via jsdelivr) -->
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script>
      // Desactivar worker ANTES de que maplibre-gl lo intente crear
      window.MAPLIBRE_GL_NO_WORKER = true;
      // Interceptor para desactivar workers cuando UMD cargue
      let _maplibregl = null;
      Object.defineProperty(window, 'maplibregl', {
        configurable: true,
        set: function(val) {
          _maplibregl = val;
          if (val && val.workerCount !== undefined) {
            val.workerCount = 0;
          }
        },
        get: function() {
          return _maplibregl;
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
