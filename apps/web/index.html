    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js" id="maplibre-script"></script>
    <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script>
      // Desactivar worker ANTES de que maplibre-gl lo intente crear
      window.MAPLIBRE_GL_NO_WORKER = true;
      // Cuando el script UMD cargue, desactivar workerCount y registrar protocolo pmtiles
      const script = document.getElementById('maplibre-script');
      script.onload = () => {
        if (window.maplibregl) {
          window.maplibregl.workerCount = 0;
          console.log('[maplibre-gl] UMD loaded, workerCount=0');
        }
      };
      script.onerror = () => {
        console.error('[maplibre-gl] Failed to load UMD script');
      };
    </script>
