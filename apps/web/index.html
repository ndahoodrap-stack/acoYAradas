<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <meta
      name="description"
      content="acoYAradas! - Comercios de tu zona, a un click. Comprá online, seguí tu pedido y ganá lugar en tu barrio."
    />
    <link rel="icon" type="image/svg+xml" href="/placeholders/logo-aco.svg" />
    <title>acoYAradas! - Comercios de tu zona</title>
    <!-- maplibre-gl UMD build (sin worker externo, CORS OK, worker inline) -->
    <script src="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.umd.js"></script>
    <link href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script>
      // Desactivar worker ANTES de que maplibre-gl lo intente crear
      window.MAPLIBRE_GL_NO_WORKER = true;
      // También desactivar via workerCount cuando el objeto esté disponible
      if (window.maplibregl) {
        window.maplibregl.workerCount = 0;
      } else {
        // Si no está listo, usar Object.defineProperty para interceptar cuando se cargue
        Object.defineProperty(window, 'maplibregl', {
          configurable: true,
          set: function(val) {
            if (val && val.workerCount !== undefined) {
              val.workerCount = 0;
            }
            Object.defineProperty(window, 'maplibregl', {
              configurable: true,
              value: val,
              writable: true
            });
          },
          get: function() {
            return this._maplibregl;
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
